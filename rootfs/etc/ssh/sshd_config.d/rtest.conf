# rtest: key-only access for the "runner" user.
HostKey /work/ssh/ssh_host_ed25519_key
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers runner
X11Forwarding no
PrintMotd no
# Parallel runs open many sessions, often over one multiplexed connection.
MaxSessions 64
MaxStartups 64:30:256
# Detect clients that disappear, so that their runs stop.
ClientAliveInterval 15
ClientAliveCountMax 4
