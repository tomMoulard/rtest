name: 'CI'

on:  # yamllint disable-line rule:truthy
  push:
    branches: ['**']
    tags: ['v*']
  pull_request: {}

jobs:
  lint:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v7'
        with:
          fetch-depth: 0
      - uses: 'actions/setup-go@v7'
        with:
          go-version-file: 'go.mod'
      - name: 'Install yamllint'
        run: 'pipx install yamllint'
      - name: 'Lint'
        run: 'make lint'
      - name: 'GoReleaser configuration'
        uses: 'goreleaser/goreleaser-action@v7'
        with:
          version: '~> v2'
          args: 'check'
      - name: 'GoReleaser snapshot build'
        uses: 'goreleaser/goreleaser-action@v7'
        with:
          version: '~> v2'
          args: 'release --snapshot --clean'

  unit:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v7'
      - uses: 'actions/setup-go@v7'
        with:
          go-version-file: 'go.mod'
      - name: 'Unit tests'
        run: 'make unit'

  e2e:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    steps:
      - uses: 'actions/checkout@v7'
      - uses: 'actions/setup-go@v7'
        with:
          go-version-file: 'go.mod'
      - uses: 'docker/setup-buildx-action@v4'
      - name: 'Build the image'
        uses: 'docker/build-push-action@v7'
        with:
          load: true
          tags: 'rtest:dev'
          cache-from: 'type=gha'
          cache-to: 'type=gha,mode=max'
      - name: 'Install the client dependencies'
        run: 'sudo apt-get update && sudo apt-get install -y rsync openssh-client'
      - name: 'End-to-end test'
        run: 'test/e2e.sh'

  publish-image:
    if: "github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')"
    needs: ['lint', 'unit', 'e2e']
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v7'
      - uses: 'docker/setup-qemu-action@v4'
      - uses: 'docker/setup-buildx-action@v4'
      - uses: 'docker/login-action@v4'
        with:
          username: '${{ secrets.DOCKERHUB_USERNAME }}'
          password: '${{ secrets.DOCKERHUB_TOKEN }}'
      - name: 'Image tags'
        id: 'tags'
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tags=tommoulard/rtest:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=tommoulard/rtest:latest,tommoulard/rtest:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - uses: 'docker/build-push-action@v7'
        with:
          platforms: 'linux/amd64,linux/arm64'
          push: true
          tags: '${{ steps.tags.outputs.tags }}'
          cache-from: 'type=gha'
          cache-to: 'type=gha,mode=max'

  release:
    if: "github.event_name == 'push' && github.ref_type == 'tag'"
    needs: ['lint', 'unit', 'e2e']
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'write'
    steps:
      - uses: 'actions/checkout@v7'
        with:
          fetch-depth: 0
      - uses: 'actions/setup-go@v7'
        with:
          go-version-file: 'go.mod'
      - name: 'Build and publish the release'
        uses: 'goreleaser/goreleaser-action@v7'
        with:
          version: '~> v2'
          args: 'release --clean'
        env:
          GITHUB_TOKEN: '${{ github.token }}'
